plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.moodboard.keyboard'
    compileSdk 34

    defaultConfig {
        applicationId "com.moodboard.keyboard"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
        vectorDrawables { useSupportLibrary true }
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }

    buildTypes {
        release {
            minifyEnabled false   // keep simple & reliable for v1
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions { jvmTarget = '17' }
    buildFeatures { viewBinding true }
    androidResources { noCompress 'task' }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'

    // Kotlin coroutines (async network without freezing the keyboard)
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'

    // CameraX (in-place front camera capture inside the IME)
    def camerax = "1.3.1"
    implementation "androidx.camera:camera-core:$camerax"
    implementation "androidx.camera:camera-camera2:$camerax"
    implementation "androidx.camera:camera-lifecycle:$camerax"
    implementation "androidx.camera:camera-view:$camerax"

    // Networking: NVIDIA NIM emotion API + Tenor/GIPHY sticker search
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'

    // MediaPipe Face Landmarker - on-device live facial blendshapes -> emotion
    implementation 'com.google.mediapipe:tasks-vision:0.10.14'

    // Glide for loading + animating GIFs/stickers in the grid
    implementation 'com.github.bumptech.glide:glide:4.16.0'

    // WorkManager: periodic meme pre-cache worker (SPEC_V3 workstream B)
    implementation 'androidx.work:work-runtime-ktx:2.9.1'
}
