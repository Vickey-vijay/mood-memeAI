name: Build MoodBoard APK

# Builds the installable debug APK in the cloud and publishes it as both a
# downloadable artifact and a GitHub Release asset. No Android Studio needed.

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:   # lets you trigger a build manually from the Actions tab

permissions:
  contents: write       # required to publish the APK as a Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/debug/app-debug.apk out/MoodBoard-debug.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MoodBoard-APK
          path: out/MoodBoard-debug.apk
          if-no-files-found: error

      - name: Publish APK to a Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: MoodBoard build ${{ github.run_number }}
          files: out/MoodBoard-debug.apk
          body: |
            Automatically built debug APK of the MoodBoard keyboard.
            Download `MoodBoard-debug.apk` below, copy it to your Android phone, and install it
            (you may need to allow "install from unknown sources").
